<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limpar cache — Vernissages SP</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2EFE9">
<style>
  @font-face{font-family:Switzer;src:url(fontes/Switzer-Variable.woff2) format("woff2");font-weight:100 900;font-display:swap}
  :root{--paper:#F2EFE9;--ink:#0E0E0E;--terra:#C96F4A;--mute:#6f6a60}
  *{box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:Switzer,system-ui,-apple-system,'Segoe UI',sans-serif;
    min-height:100vh;margin:0;padding:clamp(18px,4vw,48px);display:flex;flex-direction:column;justify-content:space-between}
  .marca{font-weight:800;font-size:clamp(34px,11vw,120px);line-height:.82;letter-spacing:-.055em;text-transform:uppercase;margin:0}
  .c{max-width:520px;border-top:2px solid var(--ink);padding-top:18px;margin:40px 0}
  .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--terra);margin:0 0 10px}
  #s{font-size:clamp(18px,2.2vw,24px);line-height:1.4;margin:0}
  #s small{display:block;margin-top:10px;font-size:13px;color:var(--mute);word-break:break-word}
  .ok{font-weight:800;text-transform:uppercase;letter-spacing:-.02em;font-size:1.4em}
  .err{font-weight:800;color:var(--terra)}
  .passos{display:block;margin-top:10px;color:var(--mute);font-size:15px}
  a.bt{display:inline-block;margin-top:24px;background:var(--ink);color:var(--paper);text-decoration:none;
    padding:14px 22px;font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  a.bt:hover{background:var(--terra);color:var(--ink)}
</style>
</head>
<body>
<h1 class="marca">Vernissages SP</h1>
<div class="c">
  <p class="k">Limpar cache</p>
  <p id="s">Limpando os arquivos guardados no aparelho…</p>
  <a class="bt" id="ir" href="/" style="display:none">Abrir o site</a>
</div>
<script>
/* página independente: não usa service worker nem dados.js.
   serve para destravar aparelhos com cache antigo ou corrompido. */
(async function(){
  var s=document.getElementById('s'), ir=document.getElementById('ir'), passos=[];
  try{
    if('serviceWorker' in navigator){
      var rs=await navigator.serviceWorker.getRegistrations();
      for(var i=0;i<rs.length;i++){ await rs[i].unregister(); }
      passos.push(rs.length+' service worker(s) removido(s)');
    }
    if(window.caches){
      var ks=await caches.keys();
      for(var j=0;j<ks.length;j++){ await caches.delete(ks[j]); }
      passos.push(ks.length+' cache(s) apagado(s)');
    }
    /* chaves de cache do próprio site: a obra do dia, a cor e a textura do logo */
    try{
      localStorage.removeItem('vspSeen');
      Object.keys(localStorage).forEach(function(k){ if(/^(vspCor|vspMarca|vspAcento)/.test(k)) localStorage.removeItem(k); });
    }catch(e){}
    s.innerHTML='<span class="ok">Pronto.</span><span class="passos">'+passos.join('<br>')+'</span><span class="passos">Abrindo o site…</span>';
    setTimeout(function(){ location.replace('/?limpo='+Date.now()); }, 1600);
  }catch(e){
    s.innerHTML='<span class="err">Não consegui limpar automaticamente.</span><br>'+
      'No navegador, abra as configurações do site e use "Limpar dados".<small>'+e.message+'</small>';
    ir.style.display='inline-block';
  }
})();
</script>
</body>
</html>
