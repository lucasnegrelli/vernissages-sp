name: Renovar token do Instagram

# O token do Instagram Login vale 60 dias; renovar estende por mais 60 sem
# trocar o valor (o publicar.js falha se o Instagram devolver outro). Roda
# todo dia 1 e 15, bem antes de vencer. Se falhar, o GitHub avisa por e-mail:
# aí é gerar token novo no painel da Meta e atualizar o secret.

on:
  schedule:
    - cron: '17 12 1,15 * *'
  workflow_dispatch:

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Renovar
        env:
          IG_TOKEN_VERNISSAGESSP: ${{ secrets.IG_TOKEN_VERNISSAGESSP }}
        run: node publicar.js renovar
