name: Métricas do Instagram

# Anota todo dia seguidores, posts e engajamento por mídia em metricas/ e
# regenera metricas/RESUMO.md (ritmo, projeção até 200/500/1000 e ranking por
# formato). Ver o cabeçalho do metricas.js.

on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metricas
  cancel-in-progress: false

jobs:
  metricas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Coletar
        env:
          IG_TOKEN_VERNISSAGESSP: ${{ secrets.IG_TOKEN_VERNISSAGESSP }}
        run: node metricas.js
      - name: Gravar
        run: |
          git config user.name "vsp-metricas"
          git config user.email "actions@users.noreply.github.com"
          git add metricas
          git diff --cached --quiet || { git commit -m "metricas: placar do dia"; git pull --rebase -q; git push; }
