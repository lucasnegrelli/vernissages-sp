name: Gerar acervo e paginas

on:
  push:
    paths:
      - 'dados.js'
      - 'gerar.js'
      - '.github/workflows/build.yml'
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: acervo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerar acervo, paginas e sitemap
        run: node gerar.js

      - name: Commitar o que mudou
        run: |
          git config user.name "vernissages-bot"
          git config user.email "actions@github.com"
          git add -A acervo.json arquivo.html artistas.html editais.html sitemap.xml robots.txt m a
          if git diff --staged --quiet; then
            echo "Nada mudou no acervo."
            exit 0
          fi
          git commit -m "Acervo: regenera paginas e sitemap [skip ci]"
          # o espelhar-imagens tambem empurra pra main e pode ganhar a corrida:
          # rebaseia e tenta de novo em vez de morrer no primeiro ref rejeitado.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejeitado, tentativa $i - rebaseando e tentando de novo"
            git fetch origin main
            git rebase origin/main || exit 1
            sleep 3
          done
          echo "Falhou ao empurrar apos 5 tentativas."
          exit 1
