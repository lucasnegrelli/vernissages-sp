name: Caçador de imagens

# Fecha o buraco de imagem do dados.js (47% das mostras em cartaz sem imagem
# que passasse na régua, em 26/10/2026). Três etapas:
#   1. cacar-imagens.js  acha a mostra no agregador e no site da casa, baixa os
#                        candidatos, mede, tira repetidas e monta a folha de contato
#   2. --auto            julga por regras (formato de obra, resolução, nome do arquivo). SEM IA: não gasta crédito
#   3. --aplicar         copia p/ img/, edita o dados.js e roda o check.js;
#                        reprovou, desfaz tudo e o job falha
# O portão é o check.js. Dúvida real vira "escolha: null" e entra no resumo:
# é o 1% do Lucas. Roda sexta 12:00 UTC, antes do planejar de domingo, e
# depois que o radar e o garimpo de sábado já mexeram no dados.js.

on:
  schedule:
    - cron: '0 12 * * 5'        # sexta: varredura completa
    - cron: '30 10 * * *'       # todo dia 07:30 em SP: só as aberturas dos próximos 10 dias, forçando a busca
  workflow_dispatch:
    inputs:
      aberturas:
        description: 'Só aberturas dos próximos N dias (vazio = varredura completa)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: cacar-imagens
  cancel-in-progress: false

jobs:
  cacar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CHROME: /usr/bin/google-chrome
      RENDER_DIR: ${{ github.workspace }}/.render
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dependências (puppeteer-core e sharp)
        run: |
          mkdir -p .render && cd .render
          echo '{"name":"render","private":true}' > package.json
          npm i puppeteer-core sharp >/dev/null 2>&1

      - name: Caçar candidatas
        id: cacar
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "0 12 * * 5" ]; then ARGS="--aberturas=10"; fi
          if [ -n "${{ github.event.inputs.aberturas }}" ]; then ARGS="--aberturas=${{ github.event.inputs.aberturas }}"; fi
          echo "modo: ${ARGS:-varredura completa}"
          node cacar-imagens.js $ARGS | tee /tmp/cacar.log
          N=$(node -e "try{console.log(require('./PENDENTE/cacador/fila.json').length)}catch{console.log(0)}")
          echo "fila=$N" >> "$GITHUB_OUTPUT"

      - name: Julgar (regras automáticas, sem IA e sem custo)
        if: steps.cacar.outputs.fila != '0'
        run: node cacar-imagens.js --auto | tee /tmp/julgamento.log

      - name: Aplicar (check.js é o portão)
        if: steps.cacar.outputs.fila != '0'
        run: node cacar-imagens.js --aplicar | tee /tmp/aplicar.log

      - name: Commitar
        if: steps.cacar.outputs.fila != '0'
        run: |
          git config user.name "vernissages-bot"
          git config user.email "actions@github.com"
          git add dados.js img acervo-imagens.json
          if git diff --staged --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "Caçador de imagens: rodada automática"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejeitado, tentativa $i"
            git fetch origin main && git rebase origin/main || exit 1
            sleep 3
          done
          exit 1

      - name: Aberturas ainda sem imagem (some da seção Abre esta semana até ter)
        if: always()
        run: |
          node -e "
          const fs=require('fs'),vm=require('vm');
          const c={window:{}};vm.runInNewContext(fs.readFileSync('dados.js','utf8'),c);c.D=c.window.DATA;
          const hoje=new Date(Date.now()-3*3600e3).toISOString().slice(0,10);
          const fim=new Date(Date.parse(hoje+'T12:00')+7*864e5).toISOString().slice(0,10);
          const f=((c.D&&c.D.expos)||[]).filter(e=>e.ini>=hoje&&e.ini<=fim&&!(e.img&&String(e.img).trim()));
          console.log(f.length?'SEM IMAGEM ('+f.length+'): '+f.map(e=>e.ini+' '+e.t+' @ '+e.v).join(' | '):'todas as aberturas da semana têm imagem');
          " | tee /tmp/semimg.log || true

      - name: Resumo
        if: always()
        run: |
          {
            echo '### Aberturas da semana'
            cat /tmp/semimg.log 2>/dev/null
            echo "## Caçador de imagens"
            echo '```'
            tail -40 /tmp/cacar.log 2>/dev/null
            echo '--- aplicado ---'
            cat /tmp/aplicar.log 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
