name: Dia no piloto automático

# Gera e enfileira o dia (1 peça de feed + stories) sozinho, todo dia 04:30 em
# Brasília (horário do post é sorteado entre 06:30 e 13:30). O publicar.yml posta no horário. Ver o cabeçalho do dia-auto.js.
# Falha só quando nada entrou na fila; "feed não passou" é aviso, não erro.

on:
  schedule:
    - cron: '30 7 * * *'
    - cron: '45 8 * * *'   # reserva: o cron do GitHub às vezes não dispara (28/10 não rodou); o script é idempotente
    - cron: '15 10 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      feed:
        description: 'Hora do feed (HH:MM, Brasília)'
        required: false
      story:
        description: 'Hora dos stories (HH:MM, Brasília)'
        required: false

permissions:
  contents: write

concurrency:
  group: dia-auto
  cancel-in-progress: false

jobs:
  dia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dependências de renderização
        run: |
          mkdir -p .render && cd .render
          echo '{"name":"render","private":true}' > package.json
          npm i puppeteer-core sharp ffmpeg-static >/dev/null 2>&1
          echo "FFMPEG=$PWD/node_modules/ffmpeg-static/ffmpeg" >> "$GITHUB_ENV"

      - name: Gerar feed e stories
        run: node dia-auto.js --fase=gerar | tee /tmp/dia.log

      # Legenda do feed: por regra, dentro do dia-auto.js (legenda-regra.js), sem IA e sem custo.

      - name: Enfileirar o dia
        run: node dia-auto.js --fase=enfileirar ${{ inputs.feed && format('--feed={0}', inputs.feed) }} ${{ inputs.story && format('--story={0}', inputs.story) }} | tee -a /tmp/dia.log

      - name: Commitar fila e memória
        if: always()
        run: |
          git config user.name "vsp-dia-auto"
          git config user.email "actions@users.noreply.github.com"
          # um a um: git add com caminho inexistente aborta tudo (ex.: REELS-USADOS.json antes do 1o Reel)
          for p in fila SOCIAL/USADAS.json SOCIAL/POSTADAS.json SOCIAL/FOTOS-USADAS.json SOCIAL/REELS-USADOS.json; do [ -e "$p" ] && git add "$p"; done || true
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "dia-auto: fila do dia"
          for i in 1 2 3 4 5; do
            if git pull --rebase -q origin main && git push; then exit 0; fi
            sleep 3
          done
          exit 1

      - name: Resumo
        if: always()
        run: |
          { echo "## Dia no piloto automático"; echo '```'; cat /tmp/dia.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
